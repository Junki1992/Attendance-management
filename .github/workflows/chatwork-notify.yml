name: Chatwork 翌日出勤通知
on:
  schedule:
    # 19:00 JST = 10:00 UTC。毎時実行だとタイミングずれでスキップされるため、19時のみ固定実行
    - cron: "0 10 * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node scripts/chatwork-notify.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          # エラー時のメンション先。GitHub Secrets に CHATWORK_ERROR_NOTIFY_ACCOUNT_ID を追加
          CHATWORK_ERROR_NOTIFY_ACCOUNT_ID: ${{ secrets.CHATWORK_ERROR_NOTIFY_ACCOUNT_ID }}
          CHATWORK_NOTIFY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
