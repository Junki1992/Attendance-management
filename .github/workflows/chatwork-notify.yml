# スケジュールは UTC。chatwork-notify.js が Firestore の notifyHour（JST）以降なら送信する。
#
# schedule は1本のみ（複数 cron + cancel-in-progress だと npm ci 中に次ジョブが起動し、
# 送信完了前にキャンセルされ続けて数時間「未送信」になる）。
name: Chatwork 翌日出勤通知
on:
  schedule:
    # 18時台（JST=UTC 9時）は毎分実行して到達率を最大化
    - cron: "* 9 * * *"
    # それ以外は約5分間隔（:00/:05 台の混雑を避け 2,7,12… にオフセット）
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-8,10-23 * * *"
  workflow_dispatch:

# 同時実行は1本に限定。キャンセルせずキュー待ち（キャンセルすると送信途中で止まる）
concurrency:
  group: chatwork-notify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: node scripts/chatwork-notify.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          CHATWORK_ERROR_NOTIFY_ACCOUNT_ID: ${{ secrets.CHATWORK_ERROR_NOTIFY_ACCOUNT_ID }}
          CHATWORK_NOTIFY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
