name: Chatwork 翌日出勤通知
on:
  schedule:
    - cron: "0 * * * *"  # 毎時 0 分（日本時間の何時かは Firestore の notifyHour で設定）
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node scripts/chatwork-notify.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          CHATWORK_NOTIFY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
